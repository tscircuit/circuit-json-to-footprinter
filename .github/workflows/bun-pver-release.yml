# Created using @tscircuit/plop
name: Publish to npm

on:
  push:
    branches:
      - main
      - "!version-bumps/**"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - run: npm install -g pver
      - run: bun install
      - run: bun run build
      - run: pver release --no-push-main
        env:
          NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}"
          GITHUB_TOKEN: "${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}"
      - name: Get package version
        id: package-version
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"
      - name: Create version bump pull request
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: bump version"
          title: "chore: bump version to v${{ steps.package-version.outputs.version }}"
          body: "Automated package update"
          branch: version-bumps/v${{ steps.package-version.outputs.version }}
          base: main
          token: "${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}"
          committer: tscircuitbot <githubbot@tscircuit.com>
          author: tscircuitbot <githubbot@tscircuit.com>
      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number != ''
        run: gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --auto --squash --delete-branch
        env:
          GH_TOKEN: "${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}"
